<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Cat head background -->
  <circle cx="50" cy="55" r="35" fill="#FF6B35"/>
  
  <!-- Left ear -->
  <polygon points="20,35 30,10 45,35" fill="#FF6B35"/>
  <polygon points="25,32 32,18 40,32" fill="#FFB5A0"/>
  
  <!-- Right ear -->
  <polygon points="80,35 70,10 55,35" fill="#FF6B35"/>
  <polygon points="75,32 68,18 60,32" fill="#FFB5A0"/>
  
  <!-- Face -->
  <ellipse cx="50" cy="58" rx="28" ry="25" fill="#FFF5E6"/>
  
  <!-- Left eye -->
  <ellipse cx="38" cy="52" rx="8" ry="9" fill="#2D3436"/>
  <ellipse cx="40" cy="50" rx="3" ry="4" fill="#FFFFFF"/>
  
  <!-- Right eye -->
  <ellipse cx="62" cy="52" rx="8" ry="9" fill="#2D3436"/>
  <ellipse cx="64" cy="50" rx="3" ry="4" fill="#FFFFFF"/>
  
  <!-- Nose -->
  <ellipse cx="50" cy="65" rx="5" ry="4" fill="#FF6B35"/>
  
  <!-- Mouth -->
  <path d="M50,69 Q50,75 44,72" stroke="#2D3436" stroke-width="2" fill="none"/>
  <path d="M50,69 Q50,75 56,72" stroke="#2D3436" stroke-width="2" fill="none"/>
  
  <!-- Whiskers left -->
  <line x1="15" y1="58" x2="32" y2="62" stroke="#2D3436" stroke-width="1.5"/>
  <line x1="15" y1="65" x2="32" y2="65" stroke="#2D3436" stroke-width="1.5"/>
  <line x1="15" y1="72" x2="32" y2="68" stroke="#2D3436" stroke-width="1.5"/>
  
  <!-- Whiskers right -->
  <line x1="85" y1="58" x2="68" y2="62" stroke="#2D3436" stroke-width="1.5"/>
  <line x1="85" y1="65" x2="68" y2="65" stroke="#2D3436" stroke-width="1.5"/>
  <line x1="85" y1="72" x2="68" y2="68" stroke="#2D3436" stroke-width="1.5"/>
</svg>
